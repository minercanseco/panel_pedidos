<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Validación de archivo del día</title>
<style>
  /* Página y márgenes */
  @page { size: A4; margin: 8mm; }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 6.5pt;
    margin: 0;
    color: #000;
  }

  /* Espaciador superior extra para impresoras sin margen */
  .top-spacer { height: 6mm; } /* ajusta si necesitas más/menos aire */

  .wrap { padding: 2mm 3mm; width: 100%; }
  .logo { max-height: 22px; display: block; }
  .pill { display: inline-block; padding: 0 4px; border: 1px solid #bbb; border-radius: 3px; }

  /* ===== Encabezado global en una sola línea ===== */
  .header-line {
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .header-line .title {
    font-weight: 600; overflow: hidden; text-overflow: ellipsis;
  }
  .header-line .right { margin-left: auto; white-space: nowrap; }

  /* Separadores compactos con puntos medios */
  .sep { margin: 0 6px; opacity: .8; }

  /* Oculta bloques opcionales si quedan vacíos tras el reemplazo de placeholders */
  .opt:empty { display: none; }

  hr { border: 0; border-top: 1px solid #808080; margin: 2mm 0 1.5mm; }

  /* ===== Tabla principal ===== */
  .tabla-agrupada { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .tabla-agrupada th, .tabla-agrupada td {
    padding: 1px 2px;
    vertical-align: top;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    border: 0;
  }
  .tabla-agrupada th { font-weight: 600; }
  .tabla-agrupada .num { text-align: right; }

  /* Encabezado del detalle */
  .tabla-agrupada .det-head th {
    background: #f6f6f6; border-bottom: 1px solid #bfbfbf;
  }
  .tabla-agrupada .det-head th:nth-child(3),
  .tabla-agrupada .det-head th:nth-child(6) { text-align: left; }

  .tabla-agrupada .sep-row td {
    padding-top: 3px; padding-bottom: 3px; border-bottom: 1px solid #bfbfbf;
  }

  /* ===== Fila del encabezado de documento ===== */
  .docline {
    padding: 3px 3px 2px 3px;
    border-top: 1px solid #808080;
    overflow: hidden; text-overflow: ellipsis;
  }
  .docline .v { margin-right: 8px; }
  .docline .cliente {
    font-weight: 700; text-transform: uppercase; display: inline-block;
    max-width: 12rem; overflow: hidden; text-overflow: ellipsis;
  }
  .docline .k { display: none; } /* por si quedaran etiquetas visibles */

  /* Comentarios del documento */
  .doccomments {
    padding: 1px 3px; background: #f2f2f2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #111;
    border-bottom: 1px solid #bfbfbf;
  }

  /* Anchos de columnas (detalle) — orden:
     1 Cant | 2 Unid | 3 Descripción | 4 Precio | 5 Importe | 6 Comentarios */
  .tabla-agrupada col:nth-child(1) { width: 4%; }
  .tabla-agrupada col:nth-child(2) { width: 5%; }
  .tabla-agrupada col:nth-child(4) { width: 8%; }
  .tabla-agrupada col:nth-child(5) { width: 10%; }
  .tabla-agrupada col:nth-child(6) { width: 18%; }
  .tabla-agrupada col:nth-child(3) { width: auto; }

  .desc-1, .cmt-ptd {
    text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .num { text-align: right; }
</style>
</head>
